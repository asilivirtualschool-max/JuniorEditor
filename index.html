<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Junior Editor</title>
<meta name="description" content="A writing workbook for Years 2 to 4: twelve desks in a newsroom, aligned to the Australian Curriculum v9 and the New Zealand Curriculum.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128240;</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#F0EBE0; --surface:#E4DDCD; --surface-2:#FBF8F1;
  --ink:#1F2630; --ink-soft:#56606C; --line:#C6BCA9; --line-soft:#D7CEBE;
  --press:#A8331F; --good:#2D6A4F; --bad:#96382B; --dot:rgba(31,38,48,0.07);
  --d-brief:#5A4E8C; --d-story:#B5502F; --d-facts:#2D8C82; --d-opinion:#9C3B4F;
  --d-sentence:#3E5C86; --d-expand:#2F6E5B; --d-para:#6B7B3F; --d-punct:#8C6D1F;
  --d-speech:#7A4869; --d-word:#B07E22; --d-spell:#7A5C3E; --d-proof:#37606E;
  --floor:#D8CDB8; --floor-2:#CABDA4; --wallL:#BBAE94; --wallR:#A3967C;
  --step:clamp(0.95rem,0.9rem + 0.2vw,1.03rem);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15181D; --surface:#1E232A; --surface-2:#242A32;
    --ink:#ECE6DA; --ink-soft:#A3ACB8; --line:#3A424C; --line-soft:#2C333B;
    --press:#E0674E; --good:#6FBF95; --bad:#E08874; --dot:rgba(236,230,218,0.07);
    --d-brief:#A093D8; --d-story:#E5866A; --d-facts:#57C0B4; --d-opinion:#E0788F;
    --d-sentence:#7EA2D6; --d-expand:#5FB79A; --d-para:#A8BD70; --d-punct:#D4B25A;
    --d-speech:#C289AE; --d-word:#D8A244; --d-spell:#C09B72; --d-proof:#79AEC4;
    --floor:#333B33; --floor-2:#2A3130; --wallL:#242A2A; --wallR:#1B2020;
  }
}
:root[data-theme="dark"]{
  --paper:#15181D; --surface:#1E232A; --surface-2:#242A32;
  --ink:#ECE6DA; --ink-soft:#A3ACB8; --line:#3A424C; --line-soft:#2C333B;
  --press:#E0674E; --good:#6FBF95; --bad:#E08874; --dot:rgba(236,230,218,0.07);
  --d-brief:#A093D8; --d-story:#E5866A; --d-facts:#57C0B4; --d-opinion:#E0788F;
  --d-sentence:#7EA2D6; --d-expand:#5FB79A; --d-para:#A8BD70; --d-punct:#D4B25A;
  --d-speech:#C289AE; --d-word:#D8A244; --d-spell:#C09B72; --d-proof:#79AEC4;
  --floor:#333B33; --floor-2:#2A3130; --wallL:#242A2A; --wallR:#1B2020;
}
*{box-sizing:border-box;}
html{color-scheme:light dark;}
body{margin:0;padding:0 0 80px;background:var(--paper);
  background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);background-size:22px 22px;
  color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:var(--step);line-height:1.55;min-height:100vh;}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-0.01em;text-wrap:balance;margin:0;}
img{max-width:100%;} [hidden]{display:none!important;}
.wrap{max-width:900px;margin:0 auto;padding:0 20px;}
:focus-visible{outline:2.5px solid var(--press);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* ---------- masthead ---------- */
header.top{border-bottom:3px double var(--ink);padding:20px 0 12px;margin-bottom:20px;}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand h1{font-size:2.1rem;line-height:1;letter-spacing:-0.02em;}
.brand .sub{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--ink-soft);margin-top:7px;border-top:1px solid var(--line);padding-top:6px;}
.whobox{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.who{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:0.9rem;background:var(--ink);color:var(--paper);padding:5px 13px;border-radius:2px;}
.yearchip{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.06em;border:1.5px solid var(--press);
  color:var(--press);border-radius:2px;padding:4px 9px;}
nav.tabs{display:flex;gap:6px;margin-top:15px;flex-wrap:wrap;align-items:center;}
nav.tabs button{font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;font-size:0.82rem;background:none;
  border:1.5px solid var(--ink);color:var(--ink);padding:7px 14px;border-radius:2px;cursor:pointer;}
nav.tabs button.active{background:var(--ink);color:var(--paper);}
nav.tabs .spacer{flex:1;}
nav.tabs button.press{border-color:var(--press);color:var(--press);}

.screen{display:none;} .screen.active{display:block;}
.card{background:var(--surface);border:1.5px solid var(--ink);border-radius:3px;padding:19px 21px;margin-bottom:16px;}
.lede{font-size:0.94rem;color:var(--ink-soft);max-width:64ch;margin:0 0 16px;}
.lede a{color:var(--press);text-decoration:underline;text-underline-offset:2px;}
.lede a:hover{text-decoration-thickness:2px;}
.mono,.strand{font-family:'IBM Plex Mono',monospace;font-size:0.67rem;letter-spacing:0.05em;color:var(--ink-soft);text-transform:uppercase;}
.src{font-family:'IBM Plex Mono',monospace;font-size:0.63rem;letter-spacing:0.04em;color:var(--ink-soft);
  border-top:1px dashed var(--line);padding-top:6px;margin-top:8px;display:block;}
button.primary{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:0.94rem;background:var(--ink);color:var(--paper);
  border:none;border-radius:2px;padding:10px 20px;cursor:pointer;}
button.primary:disabled{opacity:0.36;cursor:not-allowed;}
button.ghost{font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;font-size:0.81rem;background:none;
  border:1.5px solid var(--ink);color:var(--ink);border-radius:2px;padding:7px 13px;cursor:pointer;}
textarea,input[type=text],select{font-family:'Atkinson Hyperlegible',sans-serif;font-size:0.95rem;line-height:1.6;
  border:1.5px solid var(--line);border-radius:3px;padding:10px 12px;background:var(--surface-2);color:var(--ink);width:100%;}
textarea{min-height:100px;resize:vertical;} textarea:focus,input:focus,select:focus{border-color:var(--ink);}
select.inline,input.inline{width:auto;padding:6px 10px;font-size:0.87rem;}

/* ---------- the newsroom ---------- */
.roomwrap{background:var(--surface);border:1.5px solid var(--ink);border-radius:3px;padding:7px;margin-bottom:12px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;}
.floorpic{position:relative;line-height:0;min-width:660px;}
.floorpic img{display:block;width:100%;height:auto;border-radius:2px;user-select:none;}
.spot{position:absolute;margin:0;padding:0;background:transparent;border:2px solid rgba(40,26,10,0.22);border-radius:5px;
  cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s;}
.spot:hover,.spot:focus-visible{background:rgba(255,246,225,0.30);border-color:var(--ink);
  box-shadow:0 0 0 2px rgba(0,0,0,0.25);outline:none;}
.spot.done{background:rgba(47,110,91,0.26);border-color:#1E4E3F;}
.spot.done:hover,.spot.done:focus-visible{background:rgba(47,110,91,0.40);}
.spot.part{border-color:var(--ink);border-style:dashed;}
.spot.open{background:rgba(168,51,31,0.26);border-color:var(--press);}
.spot .mark{position:absolute;top:-9px;right:-9px;width:19px;height:19px;border-radius:50%;
  display:none;align-items:center;justify-content:center;color:#fff;font-size:11px;line-height:1;
  font-family:'IBM Plex Mono',monospace;border:1.5px solid var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4);}
.spot.done .mark,.spot.open .mark{display:flex;background:#1E4E3F;}
.spot.open .mark{background:var(--press);}
@media (max-width:760px){ .spot .mark{width:15px;height:15px;font-size:9px;top:-7px;right:-7px;} }
.swipehint{display:none;font-size:0.76rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;
  letter-spacing:.04em;margin:0 0 10px;}
@media (max-width:760px){ .swipehint{display:block;} }
.overpanel{position:absolute;box-sizing:border-box;background:#EFE2C4;border:1.5px solid #6B5433;border-radius:4px;
  padding:1.6% 2.0%;line-height:1.25;color:#3A2C16;display:flex;flex-direction:column;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.45), 0 1px 4px rgba(0,0,0,.28);overflow:hidden;}
.overpanel .oph{font-family:'IBM Plex Mono',monospace;font-size:clamp(7px,0.93vw,12px);letter-spacing:.09em;
  font-weight:600;margin-bottom:3%;border-bottom:1.5px solid #6B5433;padding-bottom:2%;}
.overpanel .opr{display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  font-size:clamp(6.5px,0.86vw,11.5px);padding:1.4% 0;border-bottom:1px solid rgba(107,84,51,.32);}
.overpanel .opr:last-child{border-bottom:0;}
.overpanel .opr b{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.overpanel .opn{font-family:'IBM Plex Mono',monospace;font-size:clamp(6px,0.78vw,10.5px);
  letter-spacing:.05em;margin-top:4%;color:#6B5433;text-transform:uppercase;}
.overpanel .opbar{height:11%;min-height:7px;background:#D6C49B;border:1.5px solid #6B5433;border-radius:3px;
  margin:3% 0;overflow:hidden;}
.overpanel .opbar i{display:block;height:100%;background:#2F6E5B;}
.roomlegend{display:flex;gap:15px;flex-wrap:wrap;font-size:0.77rem;color:var(--ink-soft);margin:0 0 18px;align-items:center;}
.roomlegend .sw{width:13px;height:13px;border:2px solid transparent;display:inline-block;vertical-align:-2px;margin-right:5px;border-radius:3px;}
.roomlegend .sw.plain{border-color:var(--line);background:var(--surface);}
.roomlegend .sw.part{border-color:var(--ink);border-style:dashed;}
.roomlegend .sw.done{border-color:#1E4E3F;background:rgba(47,110,91,0.55);}
.roomlegend .pressnote{flex:1 1 100%;font-size:0.84rem;line-height:1.5;color:var(--ink);
  border-left:3px solid var(--ink-soft);padding:8px 0 8px 12px;margin-top:2px;}
.roomlegend .pressnote.on{border-left-color:var(--press);}

table.contents{width:100%;border-collapse:collapse;}
table.contents th{font-family:'IBM Plex Mono',monospace;font-size:0.63rem;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:0 9px 7px;border-bottom:1.5px solid var(--ink);}
table.contents td{padding:10px 9px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
table.contents tr:last-child td{border-bottom:none;}
table.contents .n{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--ink-soft);width:28px;}
table.contents .dk{font-family:'Fraunces',Georgia,serif;font-size:0.98rem;}
table.contents .ot{font-size:0.84rem;color:var(--ink-soft);}
table.contents .go{text-align:right;white-space:nowrap;}
.pill{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;letter-spacing:0.05em;border:1.5px solid var(--line);
  border-radius:20px;padding:2px 9px;color:var(--ink-soft);white-space:nowrap;}
.pill.done{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.pill.part{border-color:var(--press);color:var(--press);}
@media (max-width:640px){table.contents .ot{display:none;}}

/* ---------- desk ---------- */
.deskhead{border-left:7px solid var(--line);padding-left:15px;margin-bottom:15px;}
.deskhead .dn{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);}
.deskhead h2{font-size:1.45rem;margin:2px 0 4px;}
.deskhead .flavour{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:0.97rem;color:var(--ink-soft);max-width:62ch;margin:6px 0 8px;}
.outcome{border-left:4px solid var(--line);background:var(--surface-2);border-radius:0 3px 3px 0;padding:10px 14px;
  margin-top:10px;max-width:62ch;font-family:'Fraunces',Georgia,serif;font-size:1rem;line-height:1.45;}
.outcome b{display:block;font-family:'IBM Plex Mono',monospace;font-size:0.64rem;letter-spacing:0.07em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;}
.gobar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:0.84rem;}
.stepper{display:flex;margin-bottom:16px;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;}
.stepper button{flex:1 1 100px;background:var(--surface);border:none;border-right:1.5px solid var(--ink);padding:9px 5px;
  cursor:pointer;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:0.66rem;font-weight:600;
  letter-spacing:0.03em;text-transform:uppercase;}
.stepper button:last-child{border-right:none;}
.stepper button.on{background:var(--ink);color:var(--paper);}
.stepper button.cleared::after{content:" ✓";}
.stage h3{font-size:1.12rem;margin-bottom:8px;}
.prose{max-width:64ch;} .prose p{margin:0 0 10px;}

.buildbox{border:1.5px solid var(--line);border-radius:3px;background:var(--surface-2);padding:15px 17px;margin:12px 0;}
.buildtext{font-family:'Fraunces',Georgia,serif;font-size:1.02rem;line-height:1.55;margin:0 0 10px;min-height:3.1em;}
.buildmove{font-size:0.86rem;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:9px;margin:0;}
.buildmove b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:0.67rem;letter-spacing:0.05em;
  text-transform:uppercase;display:block;margin-bottom:3px;}
.buildnav{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;}
.pips{display:flex;gap:5px;}
.pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);}
.pip.on{background:var(--ink);}
mark{background:var(--press);color:#fff;padding:0 3px;border-radius:2px;}

/* ---------- year-banded tasks ---------- */
.yearbar{display:flex;gap:0;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;margin-bottom:14px;}
.yearbar button{flex:1;background:var(--surface);border:none;border-right:1.5px solid var(--ink);padding:9px 6px;cursor:pointer;
  color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:0.7rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;}
.yearbar button:last-child{border-right:none;}
.yearbar button.on{background:var(--ink);color:var(--paper);}
.yearbar button .mine{display:block;font-size:0.56rem;letter-spacing:0.08em;opacity:0.75;margin-top:2px;}
.task{border:1.5px solid var(--line);border-radius:3px;padding:15px 17px;margin-bottom:14px;background:var(--surface-2);position:relative;}
.task.done{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good);}
.tasktag{position:absolute;top:13px;right:15px;font-family:'IBM Plex Mono',monospace;font-size:0.62rem;font-weight:600;
  letter-spacing:0.06em;border:1.5px solid var(--line);color:var(--ink-soft);border-radius:2px;padding:2px 7px;}
.task.done .tasktag{border-color:var(--good);color:var(--good);}
.instr{border-left:3px solid var(--press);background:var(--paper);border-radius:0 3px 3px 0;padding:10px 13px;margin:10px 0;font-size:0.92rem;}
.instr b{font-family:'IBM Plex Mono',monospace;font-size:0.65rem;letter-spacing:0.05em;text-transform:uppercase;
  display:block;margin-bottom:3px;color:var(--ink-soft);}
.given{font-family:'Fraunces',Georgia,serif;font-size:0.96rem;background:var(--paper);border:1px solid var(--line);
  border-radius:3px;padding:11px 13px;margin:0 0 10px;}
.say{font-size:0.84rem;margin:0 0 9px;padding:8px 12px;border-left:3px solid var(--d-brief);background:var(--paper);border-radius:0 3px 3px 0;}
.say b{font-family:'IBM Plex Mono',monospace;font-size:0.65rem;letter-spacing:0.05em;text-transform:uppercase;}
.ready{font-size:0.84rem;margin:9px 0 0;padding:8px 12px;border:1px dashed var(--line);border-radius:3px;background:var(--paper);}
.ready b{font-family:'IBM Plex Mono',monospace;font-size:0.67rem;letter-spacing:0.05em;text-transform:uppercase;}
details.reveal{margin-top:10px;}
details.reveal summary{cursor:pointer;font-weight:700;font-size:0.84rem;}
details.reveal .body{font-family:'Fraunces',Georgia,serif;font-size:0.94rem;margin-top:6px;padding:10px 12px;
  background:var(--paper);border-radius:3px;border:1px solid var(--line);white-space:pre-wrap;}
.tickbtn{display:inline-flex;align-items:center;gap:9px;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;
  font-size:0.85rem;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);border-radius:3px;
  padding:9px 15px;cursor:pointer;margin-top:10px;}
.tickbtn .box{width:16px;height:16px;border:1.5px solid var(--ink);border-radius:2px;display:grid;place-items:center;font-size:11px;line-height:1;}
.tickbtn.on{background:var(--good);border-color:var(--good);color:#fff;}
.tickbtn.on .box{border-color:#fff;background:#fff;color:var(--good);}
.orbook{font-size:0.79rem;color:var(--ink-soft);margin:6px 0 0;}
.wc{font-size:0.77rem;color:var(--ink-soft);margin-top:5px;}

.checkgrid{display:grid;gap:8px;margin:12px 0;}
.checkgrid label{display:flex;gap:9px;align-items:flex-start;font-size:0.89rem;}
.bands{display:grid;gap:8px;margin:12px 0;}
.bd{display:grid;grid-template-columns:118px 1fr;gap:12px;border:1.5px solid var(--line);border-radius:3px;
  padding:11px 13px;background:var(--surface-2);cursor:pointer;align-items:start;}
.bd.picked{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--press);}
.bd .lvl{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;}
.bd .desc{font-size:0.87rem;}
.bd .next{font-size:0.84rem;color:var(--ink-soft);margin-top:5px;display:none;}
.bd.picked .next{display:block;}
.bd .next b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:0.66rem;letter-spacing:0.05em;text-transform:uppercase;}
@media(max-width:560px){.bd{grid-template-columns:1fr;gap:4px;}}
.filed{border:2px solid var(--good);border-radius:3px;padding:16px 18px;background:var(--surface-2);margin-top:16px;}
.filed h3{color:var(--good);}
.count-note{font-size:0.79rem;color:var(--ink-soft);margin:4px 0;}
.count-note.bad{color:var(--bad);font-weight:700;}
.history{border:1px dashed var(--line);border-radius:3px;padding:12px 14px;margin-top:14px;background:var(--paper);}
.history h4{font-size:0.94rem;margin-bottom:6px;}
.history ul{margin:0;padding-left:18px;font-size:0.84rem;color:var(--ink-soft);}

/* ---------- curriculum table ---------- */
table.curr{width:100%;border-collapse:collapse;font-size:0.84rem;}
table.curr th{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;letter-spacing:0.05em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:0 9px 7px;border-bottom:1.5px solid var(--ink);}
table.curr td{padding:10px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
table.curr code{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--press);white-space:nowrap;}
.scroll-x{overflow-x:auto;}

/* ---------- dialog ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,10,14,0.82);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:60;overflow-y:auto;}
.overlay[hidden]{display:none!important;}
.overlay .box{background:var(--paper);border:2px solid var(--ink);border-radius:4px;max-width:480px;width:100%;padding:24px;margin:auto;}
.overlay h2{font-size:1.22rem;margin-bottom:6px;} .overlay p{font-size:0.88rem;color:var(--ink-soft);}
.optrow{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:3px;padding:11px 13px;
  margin:8px 0;cursor:pointer;background:var(--surface-2);}
.optrow.sel{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--press);}
.optrow .t{font-weight:700;font-size:0.9rem;} .optrow .d{font-size:0.82rem;color:var(--ink-soft);margin-top:2px;}
.field-label{font-size:0.83rem;font-weight:700;display:block;margin:12px 0 5px;}

/* ---------- the printed edition ---------- */
#printRoot{display:none;}
.pdoc{font-family:'Fraunces',Georgia,serif;color:#000;}
.pcover{border-bottom:3px double #000;padding-bottom:12px;margin-bottom:18px;}
.pcover h1{font-size:25pt;margin:0 0 6px;}
.pcover .meta{font-family:'IBM Plex Mono',monospace;font-size:8.5pt;letter-spacing:0.07em;text-transform:uppercase;color:#444;}
.pdesk{page-break-before:always;break-before:page;}
.pdesk:first-of-type{page-break-before:auto;break-before:auto;}

.pdesk .pout{font-size:10pt;font-style:italic;margin:7px 0 3px;}

.pgo{margin-top:13px;}

.pband{border:1.5px solid #000;padding:9px 12px;margin-top:10px;page-break-inside:avoid;}
.pband .pl{font-family:'IBM Plex Mono',monospace;font-size:8pt;letter-spacing:0.06em;text-transform:uppercase;color:#555;}
.pband .pv{font-size:12.5pt;font-weight:600;}
.pband .pn{font-family:'Atkinson Hyperlegible',sans-serif;font-size:9.5pt;margin-top:4px;}

  @page{margin:16mm 15mm;}

<body>

        <th>#</th><th>Desk</th><th>What you will be able to do</th><th>State</th><th></th>
      </tr></thead><tbody id="contentsBody"></tbody></table>
    </div>

  <section class="screen" id="screen-desk">

    <div class="stepper" id="stepper"></div>

  <section class="screen" id="screen-curriculum">
    <div id="currHost"></div>
  </section>
</div>

<div class="overlay" id="dialog" hidden><div class="box" id="dialogBox"></div></div>
<div id="printRoot"></div>

<script>
/* ============================================================
   THE JUNIOR EDITOR — twelve desks, Years 2 to 4
   ------------------------------------------------------------
   Every worked example marked NS1–NS4 is Crown-copyright
   exemplification from The National Strategies, Support for
   Writing (2008) — real teacher demonstrations and real
   children's drafts. Anything else is written for this desk.

   Curriculum lines are quoted from:
   • AC9  — Australian Curriculum English v9.0 (ACARA)
   • NZC  — The New Zealand Curriculum, English (refreshed),
            Phase 1 (Years 0–3) and Phase 2 (Years 4–6)
   ============================================================ */
const NS1 = 'National Strategies · Support for Writing, Year 1';
const NS2 = 'National Strategies · Support for Writing, Year 2';
const NS3 = 'National Strategies · Support for Writing, Year 3';
const NS4 = 'National Strategies · Support for Writing, Year 4';
const OWN = 'Written for this desk';

const YEARS = [
  {k:'y2', label:'Year 2', color:'#2F6E5B'},
  {k:'y3', label:'Year 3', color:'#3E5C86'},
  {k:'y4', label:'Year 4', color:'#9C3B4F'}
];

const BANDS = ['Not yet', 'Nearly there', 'Got it', 'Front page'];

const DESKS = [
/* ---------------------------------------------------------- 1 */
{
 n:1, id:'brief', name:'The Brief Desk', col:0, row:0, color:'var(--d-brief)',
 flavour:'Every job on this floor starts here. Before anybody writes a word, somebody has to say who it is for and what it is meant to do.',
 outcome:'I can say who I am writing for and what I want my writing to do, before I start.',
 what:'A brief is the short note an editor gives a writer. It says two things: who will read this, and what it should do to them — make them laugh, tell them something, or change their mind. Everything else you choose comes from those two answers.',
 why:'Writers who name their reader first make better choices all the way through. Writers who do not, drift.',
 au:{y2:'AC9E2LY06 — create and edit short imaginative, informative and persuasive texts for familiar audiences',
     y3:'AC9E3LY03 — identify the audience and purpose of imaginative, informative and persuasive texts',
     y4:'AC9E4LY03 — identify the characteristic features used in imaginative, informative and persuasive texts to meet the purpose of the text'},
 nz:{y2:'Identify the audience and purpose, then choose an appropriate language register (e.g. formal or informal language).',
     y3:'Identify audience and purpose before writing and choose language to suit.',
     y4:'Plan writing by selecting the appropriate text type, language register, and words to best communicate the intended meaning.'},
 build:{
  context:'A Year 3 class is about to write adventure stories. Before they start, the teacher asks them to agree one success criterion — and it is not about spelling or neat writing.',
  source:NS3,
  steps:[
   {text:'The class is writing adventure stories. Their stories will be read by other children in the class.', move:'WHO IS IT FOR?|Not the teacher. Other children. That single fact changes what counts as good.'},
   {text:'<mark>Success criterion for PURPOSE: The adventure story will be exciting for my readers.</mark>', move:'WHAT SHOULD IT DO?|One line. Not "use adjectives", not "write neatly" — what it must do to the person reading it.'},
   {text:'After the first draft, each child reads their partner’s story and suggests how it could be improved — judged against that one criterion.', move:'NOW IT IS USEFUL|Because the brief says "exciting", the partner knows exactly what to look for. A vague brief gives vague feedback.'}
  ]},
 tasks:{
  y2:{prompt:'Pick something that happened at school this week. Write WHO you would tell it to, and WHAT you want them to feel or know. Two short lines.',
      say:'Say both lines out loud to a partner before you write.',
      ready:'I have named one real person or group, and said what I want my writing to do.',
      model:'Who: my nan, who lives far away.  What: I want her to laugh about the dog getting into the hall.'},
  y3:{prompt:'Write a one-line brief for a story you could write: who will read it, and what it must do to them. Use the pattern "My story will be ___ for my readers."',
      say:'Say your line aloud. If it only describes the story, it is not a brief yet — it has to say what the story does.',
      ready:'My line names my reader AND says what the writing should do to them.',
      model:'My story will be scary for the Year 2 class when I read it to them at assembly.'},
  y4:{given:'Our school needs a new bike rack.',
      prompt:'Write TWO briefs for this same fact: one for a letter to the head teacher, one for a poster in the playground. For each, write the reader, the job, and one word you would use for that reader but not the other.',
      say:'Read both briefs aloud. Your voice should change between them.',
      ready:'Two briefs, two different readers, and I can point to a word that belongs to one and not the other.',
      model:'Letter — Reader: the head teacher. Job: to get a decision. Word: "currently". / Poster — Reader: children walking past. Job: to make them sign. Word: "Come on!"'}
 },
 press:{prompt:'Choose a real piece of writing you are about to do. Write its brief: the reader, the job, and three words you will reach for because of that reader.',
        evidence:'Copy out your reader and your job, in that order.',
        checks:['I have named one reader, not "everyone"','I have said what my writing should DO','My three words suit that reader','I could explain my choices to somebody else']},
 bands:[
  {lvl:'Not yet', desc:'I wrote about the topic but did not say who it was for.', next:'Write one line: "This is for ___." Name one real person.'},
  {lvl:'Nearly there', desc:'I named a reader, but not what the writing should do.', next:'Add a second line beginning "I want them to…" — laugh, understand, agree, or do something.'},
  {lvl:'Got it', desc:'Reader and job are both clear, and my words suit the reader.', next:'Write the same brief for a different reader and see which words have to change.'},
  {lvl:'Front page', desc:'The brief shapes every choice — I can point to words I picked because of that reader.', next:'Try a reader who disagrees with you. What has to change then?'}
 ]
},
/* ---------------------------------------------------------- 2 */
{
 n:2, id:'story', name:'The Story Desk', col:1, row:0, color:'var(--d-story)',
 flavour:'Where the made-up things get made up. Somebody wants something, something gets in the way, and by the end it is sorted out — or it is not.',
 outcome:'I can write a story with a character who wants something, a problem, and an ending that sorts it out.',
 what:'A story is not just things happening in order. Somebody has to want something, and something has to get in the way. That is the engine. Without it you have a list of events, not a story.',
 why:'Both the beginning-middle-end you learn in Year 2 and the character-setting-problem-resolution you learn in Year 3 are the same idea getting sharper.',
 au:{y2:'AC9E2LY06 — create short imaginative texts using text structure appropriate to purpose',
     y3:'AC9E3LY06 — plan, create, edit and publish imaginative texts with ideas grouped in simple paragraphs',
     y4:'AC9E4LY06 — plan, create, edit and publish imaginative texts using relevant linked ideas and complex sentences'},
 nz:{y2:'Planning and writing narratives with a clear beginning, middle, and end.',
     y3:'Planning and writing narratives with character development, interesting settings, and a problem with resolution.',
     y4:'Narratives containing character, setting, problem, and resolution; texts begin to include paragraphs to organise events and begin to include dialogue.'},
 build:{
  context:'A Year 2 child is retelling a story in the voice of the main character — Sam, from a book the class has read. Watch what the teacher asks them to change.',
  source:NS2,
  steps:[
   {text:'Sam was the son of a pirate. Sam had a pirate ship. Sam was brave. He liked adventures. He had seen the whole world.', move:'THE CHILD’S FIRST DRAFT|Every fact is true and the story has not started. Nobody wants anything yet.'},
   {text:'Sam’s ship could fly. <mark>Sam saw the moon. He had an idea.</mark>', move:'NOW SOMEBODY WANTS SOMETHING|One sentence turns a description into a story. He sees the moon and he wants to go.'},
   {text:'"I will fly my ship. I will go to the moon," he thought.', move:'LET THE CHARACTER SAY IT|The want is now in his own voice. A reader believes a character more than a narrator.'}
  ]},
 tasks:{
  y2:{prompt:'Write a story in three sentences: a beginning, a middle and an end. Somebody must WANT something in the first sentence.',
      say:'Say the first sentence aloud. If nobody wants anything, change it.',
      ready:'Three sentences, and the first one tells me what somebody wants.',
      model:'Mia wanted the last red bike. Her brother got there first. So she took the blue one and beat him to the gate.'},
  y3:{prompt:'Plan a story in four boxes: who, where, what goes wrong, how it is sorted out. Then write the "what goes wrong" part only, in three or four sentences.',
      say:'Tell your four boxes to a partner in under thirty seconds.',
      ready:'My problem actually stops the character getting what they want.',
      model:'Who: Ben, who collects keys. Where: his grandad’s shed. Wrong: the shed key is the one key he has lost. Sorted: grandad had a spare in a tin all along.'},
  y4:{given:'Ravi wanted to win the race. He ran fast. He won the race. He was happy.',
      prompt:'Improve this. Keep it to one paragraph, give Ravi a problem that nearly stops him, and put ONE line of speech in.',
      say:'Read the original aloud. It takes nine seconds and nothing happens. Make yours take longer.',
      ready:'There is a problem, the ending answers it, and one line of speech is punctuated properly.',
      model:'Ravi had wanted to win since the trials, and he had the lane he wanted. Then, forty metres in, his lace went. "Leave it," he told himself, and ran the last stretch with one shoe flapping like a landed fish. He came second. It felt better than the trials had.'}
 },
 press:{prompt:'Write a short story. Somebody wants something, something gets in the way, and the ending answers the beginning.',
        evidence:'Copy out the sentence where we find out what your character wants, and the sentence where it goes wrong.',
        checks:['Somebody wants something in the first few lines','Something gets in the way','The ending answers the beginning','I read it aloud and it is not just a list of events']},
 bands:[
  {lvl:'Not yet', desc:'Things happen one after another but nobody wants anything.', next:'Add one sentence near the start: "___ wanted ___."'},
  {lvl:'Nearly there', desc:'Somebody wants something, but nothing gets in the way.', next:'Put one problem in the middle that nearly stops them.'},
  {lvl:'Got it', desc:'Want, problem and ending all there, and the ending answers the beginning.', next:'Add one line of speech at the moment it goes wrong.'},
  {lvl:'Front page', desc:'The problem matters, the ending is earned, and the character sounds like a person.', next:'Try an ending where they do not get what they wanted — and it is still a good ending.'}
 ]
},
/* ---------------------------------------------------------- 3 */
{
 n:3, id:'facts', name:'The Facts Desk', col:2, row:0, color:'var(--d-facts)',
 flavour:'No opinions here, thank you. Just what is true, in an order a reader can follow, with the most useful thing first.',
 outcome:'I can explain something true, with my ideas grouped so a reader can follow them.',
 what:'Informing is not just knowing things. It is choosing which things a reader needs, putting them in a sensible order, and grouping the ones that belong together.',
 why:'The hard part is almost never the facts. It is the order.',
 au:{y2:'AC9E2LY06 — create short informative texts using text structure appropriate to purpose and topic-specific vocabulary',
     y3:'AC9E3LA04 — understand that paragraphs are a key organisational feature, grouping related information together',
     y4:'AC9E4LA04 — identify how text connectives including temporal and conditional words are used to sequence and connect ideas'},
 nz:{y2:'Planning and writing texts to share information on a familiar topic, using simple organisational structures.',
     y3:'Planning and writing informative texts with organised ideas, using paragraphs to group related information.',
     y4:'Introduce a topic, and group information together using simple paragraphs.'},
 build:{
  context:'A Year 3 class is turning a page about light into notes they can write from. Watch what survives the cut.',
  source:NS3,
  steps:[
   {text:'Light is an important form of energy for living things on Earth. When there is no light at all, humans cannot see anything. We see when light enters our eyes. Light always travels from a source. It can pass through some materials but not all and that is why we get shadows.', move:'THE SOURCE TEXT|Five sentences, all true, all mixed together. Three different ideas are tangled in there.'},
   {text:'<mark>What is light?</mark> · form of energy · light enters our eyes', move:'GIVE THE GROUP A HEADING|The heading is the question a reader would ask. The notes under it only answer that question.'},
   {text:'Notes, not sentences. Key words only.', move:'CUT IT TO THE BONE|If you copy whole sentences you will copy them into your writing too, and it will not be yours.'}
  ]},
 tasks:{
  y2:{prompt:'Write three true sentences about something you know well — a pet, a game, a job someone does. Put the most important one first.',
      say:'Say all three aloud, then say which one a reader needs first.',
      ready:'Three true sentences, and the first one is the one a reader needs most.',
      model:'Guinea pigs need company. They get sad on their own, so you should keep two. They also need hay every single day, not just pellets.'},
  y3:{prompt:'Pick a topic you know. Write TWO headings that are questions a reader would ask, and three note-words under each. Notes, not sentences.',
      say:'Read your headings aloud. If they are not questions somebody would really ask, change them.',
      ready:'Two question-headings, and every note underneath answers only that question.',
      model:'What do they eat? · hay · pellets · no lettuce.   Where do they live? · hutch · outside in summer · shed in winter.'},
  y4:{given:'Bees are insects. Bees make honey. Bees live in hives. Bees are important for plants. Bees are dying out.',
      prompt:'Improve this into two groups of linked sentences. Give each group a job, and join the sentences with words like "because", "which is why" or "so".',
      say:'Read your version aloud. You should not be able to swap two sentences without it sounding wrong.',
      ready:'Two groups, each with its own job, and the sentences inside each group are joined by meaning, not just stacked.',
      model:'Bees are insects that live together in hives, which is why a single bee on its own rarely survives long. They matter far beyond their own hive, because the pollen they carry is what lets plants make seeds — so when bee numbers fall, so do crops.'}
 },
 press:{prompt:'Explain something true that you know well. Group your ideas so that everything in each group belongs together.',
        evidence:'Copy out your first sentence, and say in a few words what each group of your writing is about.',
        checks:['Everything I wrote is true','My ideas are grouped, not jumbled','The most useful thing is near the start','Someone who knew nothing could follow it']},
 bands:[
  {lvl:'Not yet', desc:'True facts, but in the order they came into my head.', next:'Find two facts that belong together and put them next to each other.'},
  {lvl:'Nearly there', desc:'Some grouping, but the groups run into each other.', next:'Give each group a heading — even if you take the headings out later.'},
  {lvl:'Got it', desc:'Ideas are grouped, the order makes sense, and the opening is useful.', next:'Join two sentences inside a group with "because" or "which is why".'},
  {lvl:'Front page', desc:'The order itself helps the reader; groups are linked, not just listed.', next:'Move your last group to the front. Is it better? Decide on purpose.'}
 ]
},
/* ---------------------------------------------------------- 4 */
{
 n:4, id:'opinion', name:'The Opinion Desk', col:3, row:0, color:'var(--d-opinion)',
 flavour:'The only desk where you are allowed to say what you think — as long as you can say why, and the why is better than "because I like it".',
 outcome:'I can say what I think and back it up with reasons a reader would accept.',
 what:'An opinion on its own is just a noise. An opinion with a reason is an argument. An opinion with a reason AND an example is hard to argue with.',
 why:'Your reader does not have to agree with you. They do have to see why you think it.',
 au:{y2:'AC9E2LY06 — create short persuasive texts for familiar audiences',
     y3:'AC9E3LY06 — plan, create, edit and publish persuasive texts with topic-specific vocabulary',
     y4:'AC9E4LY06 — plan, create, edit and publish persuasive texts using relevant linked ideas and complex sentences'},
 nz:{y2:'Planning and writing texts to persuade, using simple reasons and examples.',
     y3:'Planning and writing persuasive texts with reasons supported by examples or evidence.',
     y4:'Introduce an opinion with supporting reasons.'},
 build:{
  context:'A Year 3 class is writing a holiday brochure that has to persuade as well as inform. First they go hunting for the words that do the persuading.',
  source:NS3,
  steps:[
   {text:'Children collect words and phrases they think will be effective persuasive devices, from real holiday web pages.', move:'STEAL FROM THE PROFESSIONALS|They do not invent persuasive words out of nowhere. They go and find the ones that are already working.'},
   {text:'<mark>family friendly · delightful · fantastic · fun for children of all ages · luxurious · maximum adventure · world-class experiences</mark>', move:'THE ACTUAL LIST THEY BUILT|Notice how many are phrases, not single words. "Maximum adventure" does more work than "fun".'},
   {text:'Pairs combine their word lists to make a bigger one, then write their brochure from it.', move:'BANK FIRST, WRITE SECOND|Choosing from a list you already made beats hunting for a word mid-sentence.'}
  ]},
 tasks:{
  y2:{prompt:'Finish this twice, with two different reasons: "I think ___ because ___." Make the second reason better than the first.',
      say:'Say both aloud. Ask a partner which reason they believe more.',
      ready:'Two reasons, and I can say which is stronger and why.',
      model:'I think we should have longer break because we only get fifteen minutes. I think we should have longer break because we come back fidgety and then nobody can concentrate.'},
  y3:{prompt:'Pick something you want changed at school. Write your opinion, then TWO reasons, and give one of them a real example.',
      say:'Say your example aloud. If you cannot give one, that reason might not be your best.',
      ready:'An opinion, two reasons, and at least one real example — something that actually happened.',
      model:'The library should be open at lunch. Children who find the playground loud have nowhere quiet. Last Tuesday six of us sat by the bins to read, because there was nowhere else.'},
  y4:{given:'School dinners should be better. They are not very nice. Everyone thinks so. Please change them.',
      prompt:'Improve this for the head teacher. Swap "everyone thinks so" for something countable, and add one phrase from a word bank you build first.',
      say:'Read the original aloud as if the head teacher were standing there. Then read yours.',
      ready:'Nothing is left that just says it is unfair; at least one thing in my version could be checked.',
      model:'On Tuesday the hot option ran out before Year 4 were called. That has happened three times this term, and the children at the end of the line are always the same ones. A simple change to the order classes are called would cost nothing and would fix it.'}
 },
 press:{prompt:'Write to persuade somebody who can actually make the change. Give your opinion, your reasons, and at least one example that could be checked.',
        evidence:'Copy out your strongest reason and the example that backs it.',
        checks:['I said clearly what I think','I gave more than one reason','At least one thing I wrote could be checked','I wrote it for the person who can change it']},
 bands:[
  {lvl:'Not yet', desc:'I said what I thought but the reason is "because I like it".', next:'Add one reason that is about somebody other than you.'},
  {lvl:'Nearly there', desc:'Reasons are there but no examples back them up.', next:'Add one real thing that happened. A date or a number makes it stronger.'},
  {lvl:'Got it', desc:'Opinion, reasons and an example that could be checked.', next:'Put your strongest reason first. Read it again and see if it hits harder.'},
  {lvl:'Front page', desc:'Every sentence works on the reader; the evidence is specific and the ask is clear.', next:'Answer the objection your reader would raise, before they raise it.'}
 ]
},
/* ---------------------------------------------------------- 5 */
{
 n:5, id:'sentence', name:'The Sentence Bench', col:3, row:1, color:'var(--d-sentence)',
 flavour:'A long bench with sentences laid out on it in pieces. Short ones, joined ones, and the ones that lean on each other.',
 outcome:'I can join my sentences together so my writing does not sound like a list.',
 what:'A simple sentence has one idea. A compound sentence joins two equal ideas with and, but or so. A complex sentence hangs one idea off another using words like because, when, although or who — and that is where real writing starts.',
 why:'Short sentences are not wrong. Only short sentences, one after another, is.',
 au:{y2:'AC9E2LA06 — understand that connections can be made between ideas by using a compound sentence with 2 or more independent clauses usually linked by a coordinating conjunction',
     y3:'AC9E3LA06 — understand that a clause is a unit of grammar usually containing a subject and a verb that need to agree',
     y4:'AC9E4LA06 — understand that complex sentences contain one independent clause and at least one dependent clause typically joined by a subordinating conjunction to create relationships, such as time and causality'},
 nz:{y2:'Combining two simple sentences orally, using a coordinating conjunction, to form a compound sentence; using compound sentences in writing.',
     y3:'Combining two simple sentences orally, using a subordinating conjunction, to form a complex sentence; using complex sentences in writing.',
     y4:'Combining sentences orally, inserting phrases, and varying the position of the phrase.'},
 build:{
  context:'A Year 2 child has written about Sam five times in a row. The teacher does not cross anything out — she asks one question.',
  source:NS2,
  steps:[
   {text:'<mark>Sam</mark> was the son of a pirate. <mark>Sam</mark> had a pirate ship. <mark>Sam</mark> was brave. He liked adventures.', move:'COUNT THE SAMS|Three sentences start the same way. The reader stops hearing the words and starts hearing the pattern.'},
   {text:'Sam was the son of a pirate <mark>so</mark> he had a pirate ship.', move:'JOIN TWO WITH A CONJUNCTION|Two sentences become one, and now the second fact is caused by the first rather than just following it.'},
   {text:'Sam was the son of a pirate. <mark>That’s why</mark> he had a pirate ship.', move:'OR KEEP TWO AND LINK THEM|The teacher offers both. Neither is the right answer — the child chooses, and that choosing is the skill.'}
  ]},
 tasks:{
  y2:{given:'I got up. I got dressed. I went downstairs. I had toast.',
      prompt:'Join two of these sentences into one using and, but or so. Then join another two.',
      say:'Say the joined sentence aloud before you write it.',
      ready:'Four sentences have become two, and each one uses and, but or so.',
      model:'I got up and got dressed in the dark. I went downstairs so I could have toast before anyone else.'},
  y3:{given:'It was raining. We stayed inside.',
      prompt:'Join these using a word that makes one part depend on the other: because, when, although, if, while. Then write two more sentences of your own the same way.',
      say:'Say it aloud. The first half should sound unfinished on its own.',
      ready:'Three sentences, each using because, when, although, if or while.',
      model:'Because it was raining, we stayed inside. When the bell finally went, nobody moved. Although the heating was on, the hall was still freezing.'},
  y4:{given:'The dog barked. The postman stepped back. He dropped the letters.',
      prompt:'Improve this into TWO sentences. One must have a phrase moved to the front, with a comma after it.',
      say:'Try the phrase at the front, then at the end. Read both aloud and keep the better one.',
      ready:'Two sentences, one with a fronted phrase and a comma, and I tried it both ways before choosing.',
      model:'As soon as the dog barked, the postman stepped back. He dropped the letters all over the path.'}
 },
 press:{prompt:'Write a short piece about anything. Use at least one simple sentence, one joined with and/but/so, and one that uses because, when, although, if or while.',
        evidence:'Copy out your three sentences and label which is which.',
        checks:['One simple sentence','One joined with and, but or so','One using because, when, although, if or while','No two sentences in a row start the same way']},
 bands:[
  {lvl:'Not yet', desc:'Almost every sentence is short and starts the same way.', next:'Join two of them with "and", "but" or "so".'},

 build:{

  source:NS4,
  steps:[

   {text:'Exercise keeps us healthy. <mark>That’s why</mark> we need to move around every day.', move:'MAKE TWO GROW FROM ONE|"That’s why" says out loud what the reader was being asked to guess.'},
   {text:'Walking is good exercise <mark>so</mark> you should walk somewhere whenever you can.', move:'JOIN THE LAST TWO|Four separate statements are now two connected ideas. Not a single fact has changed.'}

      prompt:'Improve this so that no two sentences are joined the same way, and the word "also" does not appear at all.',
      say:'Read each pair of sentences aloud. How does each one lead into the next?',
      ready:'Four different kinds of join, and no "also" anywhere.',
      model:'Dogs need exercise every single day. Just as importantly, they need company — a dog left alone all day is not a happy animal. That is why training matters too: it is time spent together, not just instructions. None of it works, though, without food that suits the animal in front of you.'}

/* ============================================================
   STATE — kept in this browser only. The printed PDF is the
   copy that leaves the device.
   ============================================================ */
const KEY = 'junior-editor-v1';
let state = {name:'', year:'y3', desks:{}};
let current = null, stageIx = 0, buildStep = 0, taskYear = null;

function deskById(id){ return DESKS.find(d => d.id === id); }
function today(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function rich(s){ return esc(s).replace(/&lt;(\/?(?:mark|b|i|br\s*\/?))&gt;/g, '<$1>'); }
function words(t){ return (t||'').trim() ? (t||'').trim().split(/\s+/).length : 0; }
function yearLabel(k){ return (YEARS.find(y => y.k === k) || {}).label || ''; }
function yearColor(k){ return (YEARS.find(y => y.k === k) || {}).color || 'var(--ink)'; }

function blankGo(n){
  return {n, started:today(), filed:null, stages:{},
          tasks:{y2:{text:'',done:false}, y3:{text:'',done:false}, y4:{text:'',done:false}},
          piece:'', evidence:'', checks:{}, band:null};
}
function deskState(id){
  if(!state.desks[id]) state.desks[id] = {goes:[blankGo(1)]};
  const d = state.desks[id];
  if(!d.goes || !d.goes.length) d.goes = [blankGo(1)];
  return d;
}
function cur(id){ const g = deskState(id).goes; return g[g.length - 1]; }
function filedGoes(id){ return deskState(id).goes.filter(g => g.filed); }
function everFiled(id){ return filedGoes(id).length > 0; }
function anyWork(id){
  const d = state.desks[id]; if(!d) return false;
  return d.goes.some(g => g.filed || g.piece || g.evidence || g.band ||
    Object.keys(g.stages||{}).length || ['y2','y3','y4'].some(y => g.tasks[y].text || g.tasks[y].done));
}
function workedGoes(id){
  const d = state.desks[id]; if(!d) return 0;
  return d.goes.filter(g => g.filed || g.piece || g.evidence || g.band ||
    ['y2','y3','y4'].some(y => g.tasks[y].text || g.tasks[y].done)).length;
}
function desksFiled(){ return DESKS.filter(d => everFiled(d.id)).length; }
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) state = Object.assign(state, JSON.parse(r)); }catch(e){}
  /* heal anything saved by an older copy of this file so a changed shape
     can never leave a child staring at a blank screen */
  if(!state.desks || typeof state.desks !== 'object') state.desks = {};
  if(!YEARS.some(y => y.k === state.year)) state.year = 'y3';
  Object.keys(state.desks).forEach(id => {
    const d = state.desks[id];
    if(!d || !Array.isArray(d.goes) || !d.goes.length){ delete state.desks[id]; return; }
    d.goes = d.goes.filter(Boolean).map((g, i) => {
      const b = blankGo(g.n || i + 1);
      const out = Object.assign(b, g);
      out.stages = (g.stages && typeof g.stages === 'object') ? g.stages : {};
      out.checks = (g.checks && typeof g.checks === 'object') ? g.checks : {};
      out.tasks  = {};
      ['y2','y3','y4'].forEach(y => {
        const t = g.tasks && g.tasks[y];
        out.tasks[y] = {text:(t && t.text) || '', done:!!(t && t.done)};
      });
      return out;
    });
    if(!d.goes.length) delete state.desks[id];
  });
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function byId(id){ return DESKS.find(d => d.id === id); }

function renderFloor(){
  document.getElementById('whoBadge').textContent = state.name || 'Editor';
  document.getElementById('yearChip').textContent = yearLabel(state.year);
  const done = desksFiled();
  const next = DESKS.find(d => !everFiled(d.id)) || DESKS[0];

  document.getElementById('introCard').innerHTML =
    '<div class="card"><h2>Twelve desks, one newsroom</h2>' +
    '<p class="lede" style="margin:8px 0 0;">Every desk on the floor below teaches one part of writing. Click a desk in the picture to go in &mdash; any desk, in any order. ' +
    'At each one you read the brief, watch a real teacher build something, do the job at your year level, and send it to press.</p>' +
    '<p class="lede" style="margin:10px 0 0;">Type your answers here if you like, or write them in your book and tick them off. ' +
    'Either way, <b>Print / Save as PDF</b> makes the copy you hand in. You can go back to a desk as many times as you want.</p>' +
    '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">' +
    '<button class="primary" id="goNext">' + (done === 0 ? 'Start at Desk 1 — The Brief Desk' : 'Carry on: Desk ' + next.n + ' — ' + esc(next.name)) + ' &rarr;</button>' +
    '<span class="count-note">' + done + ' of 12 desks sent to press</span></div></div>';
  document.getElementById('goNext').addEventListener('click', () => openDesk(next.id));

    /* --- the floor: the newsroom picture is the interface --- */
  const host = document.getElementById('roomSvg');
  const all  = desksFiled() === DESKS.length;

  const spots = SPOTS.map(p => {
    const isPress = p.id === 'press';
    let cls = 'spot', lab, state;
    if(isPress){
      cls += all ? ' open' : ' shut';
      lab = all ? 'The press — running. Every desk sent.' : 'The press — starts when all twelve desks are sent.';
      state = all ? 'running' : 'waiting';
    } else {
      const d = byId(p.id), filed = everFiled(p.id), started = !filed && anyWork(p.id);
      cls += filed ? ' done' : (started ? ' part' : '');
      state = filed ? 'sent to press' : (started ? 'in progress' : 'not begun');
      lab = 'Desk ' + d.n + ', ' + d.name + '. ' + d.outcome + ' (' + state + ')';
    }
    return '<button class="' + cls + '" data-d="' + p.id + '" aria-label="' + esc(lab) + '" title="' + esc(lab) + '"' +
      ' style="left:' + p.x + '%;top:' + p.y + '%;width:' + p.w + '%;height:' + p.h + '%;">' +
      '<span class="mark">' +
      (isPress ? (all ? '★' : '·') : '✓') + '</span></button>';
  }).join('');

  /* The picture ships with two decorative panels of invented numbers.
     Cover them with the child's real ones so nothing on screen is fictional. */
  const started = DESKS.filter(d => !everFiled(d.id) && anyWork(d.id)).length;
  const goes = DESKS.reduce((t,d) => t + workedGoes(d.id), 0);
  const pct = Math.round(done / DESKS.length * 100);

  const statusPanel =
    '<div class="overpanel" style="left:3.0%;top:30.4%;width:15.6%;height:26.6%;">' +
      '<div class="oph">THIS EDITOR</div>' +
      '<div class="opr"><span>Sent to press</span><b>' + done + '</b></div>' +
      '<div class="opr"><span>In progress</span><b>' + started + '</b></div>' +
      '<div class="opr"><span>Not begun</span><b>' + (DESKS.length - done - started) + '</b></div>' +
      '<div class="opr"><span>Goes taken</span><b>' + goes + '</b></div>' +
      '<div class="opn">' + esc(state.name || 'Editor') + ' &middot; ' + yearLabel(state.year) + '</div>' +
    '</div>';

  const progPanel =
    '<div class="overpanel" style="left:73.3%;top:84.9%;width:24.9%;height:13.3%;">' +
      '<div class="oph">YOUR PROGRESS</div>' +
      '<div class="opbar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="opr" style="border:0;"><span>' + done + ' of ' + DESKS.length + ' desks sent</span><b>' + pct + '%</b></div>' +
    '</div>';

  host.innerHTML =
    '<div class="floorpic">' +
      '<img src="' + MAP_SRC + '" alt="The newsroom floor: twelve numbered desks and the press." draggable="false">' +
      statusPanel + progPanel + spots +
    '</div>';

  host.querySelectorAll('.spot').forEach(g => {
    const id = g.dataset.d;
    g.addEventListener('click', () => {
      if(id === 'press'){
        const lg = document.getElementById('roomLegend');
        const msg = '<div class="pressnote' + (all ? ' on' : '') + '">' +
          (all ? '<b>The press is running.</b> Every desk has been sent. Print the whole edition and hand it in.'
               : '<b>The press is not running yet.</b> It starts when all twelve desks have been sent. You have sent ' +
                 desksFiled() + ' of 12.') + '</div>';
        const old = lg.querySelector('.pressnote'); if(old) old.remove();
        lg.insertAdjacentHTML('beforeend', msg);
        lg.querySelector('.pressnote').scrollIntoView({block:'nearest'});
        return;
      }
      openDesk(id);
    });
  });

  document.getElementById('roomLegend').innerHTML =
    '<span><span class="sw plain"></span>not begun</span>' +
    '<span><span class="sw part"></span>in progress</span>' +
    '<span><span class="sw done"></span>sent to press</span>' +
    '<span style="color:var(--ink)">Click a desk on the floor to go in &mdash; or use the list below.</span>';

  const body = document.getElementById('contentsBody');
  body.innerHTML = DESKS.map(d => {
    const filed = filedGoes(d.id).length, started = anyWork(d.id);
    const cls = filed ? 'pill done' : (started ? 'pill part' : 'pill');
    const lab = filed ? (filed === 1 ? 'SENT' : 'SENT ×' + filed) : (started ? 'IN PROGRESS' : 'NOT BEGUN');
    return '<tr><td class="n">' + d.n + '</td>' +
      '<td><div class="dk">' + esc(d.name) + '</div></td>' +
      '<td class="ot">' + esc(d.outcome) + '</td>' +
      '<td><span class="' + cls + '">' + lab + '</span></td>' +
      '<td class="go"><button class="ghost" data-go="' + d.id + '">' + (started ? 'Open' : 'Start') + '</button></td></tr>';
  }).join('');
  body.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => openDesk(b.dataset.go)));
}

/* ============================================================
   DESK
   ============================================================ */
function openDesk(id){ current = id; deskState(id); stageIx = 0; buildStep = 0; taskYear = state.year; show('desk'); renderDesk(); }

function renderDesk(){
  const d = deskById(current), g = cur(current), ds = deskState(current);
  const head = document.getElementById('deskHead');
  head.style.borderLeftColor = d.color;
  head.innerHTML = '<div class="dn">Desk ' + d.n + ' of 12</div><h2>' + esc(d.name) + '</h2>' +
    '<p class="flavour">' + esc(d.flavour) + '</p>' +
    '<div class="outcome" style="border-color:' + d.color + '"><b>Leave this desk able to say</b>' + esc(d.outcome) + '</div>';

  const past = ds.goes.filter(x => x.filed).length;
  const bar = document.getElementById('goBar');
  bar.innerHTML = '<span class="strand">Go ' + g.n + (g.filed ? ' · sent ' + esc(g.filed) : ' · in progress') + '</span>' +
    (past ? '<span class="count-note">' + past + ' sent earlier, all kept</span>' : '') +
    (g.filed ? '<button class="ghost" id="againBtn">Have another go</button>' : '') +
    '<button class="ghost" id="printDeskBtn">Print just this desk</button>';
  const ag = document.getElementById('againBtn');
  if(ag) ag.addEventListener('click', () => {
    ds.goes.push(blankGo(ds.goes.length + 1)); stageIx = 0; buildStep = 0; save(); renderDesk(); renderFloor();
  });
  document.getElementById('printDeskBtn').addEventListener('click', () => openPrint(current));

  const st = document.getElementById('stepper');
  st.innerHTML = STAGES.map((s,i) => '<button data-s="' + i + '" class="' +
    (i===stageIx ? 'on ' : '') + (g.stages[s.key] ? 'cleared' : '') + '">' + s.label + '</button>').join('');
  st.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { stageIx = +b.dataset.s; renderDesk(); }));

  const host = document.getElementById('stageHost');
  host.innerHTML = '';
  host.appendChild([stBrief, stWatch, stTasks, stPress][stageIx](d, g));
  window.scrollTo({top:0});
}
function card(){ const c = document.createElement('div'); c.className = 'card stage'; return c; }
function onward(g, key, label, off){
  const row = document.createElement('div');
  row.style.cssText = 'margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;';
  const b = document.createElement('button');
  b.className = 'primary'; b.textContent = label; b.disabled = !!off;
  b.addEventListener('click', () => { g.stages[key] = true; save();
    if(stageIx < STAGES.length-1) stageIx++; renderDesk(); renderFloor(); });
  row.appendChild(b); return row;
}
function tick(label, doneLabel, on, cb){
  const b = document.createElement('button');
  b.type='button'; b.className = 'tickbtn' + (on ? ' on' : '');
  const draw = () => { b.innerHTML = '<span class="box">' + (b.classList.contains('on')?'✓':'') + '</span>' +
    (b.classList.contains('on') ? doneLabel : label); };
  draw();
  b.addEventListener('click', () => { b.classList.toggle('on'); draw(); cb(b.classList.contains('on')); });
  return b;
}

function stBrief(d, g){
  const c = card();
  c.innerHTML = '<h3>What this desk is for</h3><div class="prose"><p>' + esc(d.what) + '</p><p>' + esc(d.why) + '</p></div>' +
    '<div class="instr"><b>Your year</b>' + esc(d.nz[state.year]) + '</div>';
  c.appendChild(onward(g, 'brief', 'Watch somebody do it'));
  return c;
}

function stWatch(d, g){
  const c = card();
  c.innerHTML = '<h3>Watch it being made</h3><p class="lede">' + esc(d.build.context) + '</p>';
  const box = document.createElement('div'); box.className = 'buildbox'; c.appendChild(box);
  function draw(){
    const s = d.build.steps[buildStep], parts = s.move.split('|');
    box.innerHTML = '<p class="buildtext">' + rich(s.text) + '</p>' +
      '<p class="buildmove"><b>' + esc(parts[0]) + '</b>' + esc(parts[1]||'') + '</p>' +
      '<div class="buildnav"><div class="pips">' +
        d.build.steps.map((_,i) => '<span class="pip' + (i<=buildStep?' on':'') + '"></span>').join('') + '</div></div>' +
      '<span class="src">' + esc(d.build.source) + '</span>';
    const nav = box.querySelector('.buildnav');
    if(buildStep > 0){ const b=document.createElement('button'); b.className='ghost'; b.textContent='← Back';
      b.addEventListener('click', ()=>{buildStep--;draw();}); nav.appendChild(b); }
    if(buildStep < d.build.steps.length-1){ const b=document.createElement('button'); b.className='primary';
      b.textContent='Next →'; b.style.padding='8px 15px';
      b.addEventListener('click', ()=>{buildStep++;draw();}); nav.appendChild(b); }
  }
  draw();
  c.appendChild(onward(g, 'watch', 'My turn'));
  return c;
}

function stTasks(d, g){
  const c = card();
  c.innerHTML = '<h3>Your job</h3><p class="lede">There is a job here for each year. Yours is marked, but you can try any of them &mdash; ' +
    'reaching up is allowed, and so is going back a year to get the move into your hands first.</p>';

  const yb = document.createElement('div'); yb.className = 'yearbar';
  YEARS.forEach(y => {
    const b = document.createElement('button');
    b.className = (taskYear === y.k ? 'on' : '');
    b.innerHTML = y.label + (state.year === y.k ? '<span class="mine">yours</span>' : '<span class="mine">&nbsp;</span>');
    b.addEventListener('click', () => { taskYear = y.k; renderDesk(); });
    yb.appendChild(b);
  });
  c.appendChild(yb);

  const t = d.tasks[taskYear], store = g.tasks[taskYear];
  const box = document.createElement('div'); box.className = 'task' + (store.done ? ' done' : '');
  box.innerHTML = '<span class="tasktag">' + (store.done ? 'DONE' : yearLabel(taskYear).toUpperCase()) + '</span>' +
    (t.given ? '<div class="given" style="margin-top:8px;">' + esc(t.given).replace(/ · /g,'<br>· ') + '</div>' : '') +
    '<div class="instr"><b>The job</b>' + esc(t.prompt) + '</div>' +
    '<p class="say"><b>Say it first</b><br>' + esc(t.say) + '</p>';
  const ta = document.createElement('textarea');
  ta.placeholder = 'Type your answer here — or write it in your book and tick the box.';
  ta.value = store.text || '';
  const wc = document.createElement('div'); wc.className = 'wc';
  const upd = () => { const w = words(ta.value); wc.textContent = w ? w + ' words' : ''; };
  ta.addEventListener('input', () => { store.text = ta.value; save(); upd(); });
  box.appendChild(ta); box.appendChild(wc); upd();
  const rd = document.createElement('div'); rd.className = 'ready';
  rd.innerHTML = '<b>Ready when:</b><br>' + esc(t.ready);
  box.appendChild(rd);
  const rev = document.createElement('details'); rev.className = 'reveal';
  rev.innerHTML = '<summary>Compare with a model answer</summary><div class="body">' + esc(t.model) + '</div>' +
    '<p class="count-note" style="margin-top:8px;">What did the model do that yours did not? Say it out loud, or write it underneath.</p>';
  box.appendChild(rev);
  box.appendChild(tick('I have done this job', 'Job done', store.done, on => {
    store.done = on; save(); renderDesk();
  }));
  const ob = document.createElement('p'); ob.className = 'orbook';
  ob.textContent = 'Tick it whether you typed it above or wrote it in your book.';
  box.appendChild(ob);
  c.appendChild(box);

  const mine = g.tasks[state.year].done;
  const row = onward(g, 'tasks', 'To press', !mine);
  const note = document.createElement('span'); note.className = 'count-note';
  note.textContent = mine ? '' : 'Do your own year’s job (' + yearLabel(state.year) + ') before you go to press.';
  row.appendChild(note); c.appendChild(row);
  return c;
}

function stPress(d, g){
  const c = card();
  c.innerHTML = '<h3>To press</h3>' +
    '<p class="lede">One last piece before this desk is done. Type it here or write it in your book, headed ' +
    '<b>Desk ' + d.n + ' &mdash; ' + esc(d.name) + '</b> with today’s date.</p>' +
    '<div class="instr"><b>Write this</b>' + esc(d.press.prompt) + '</div>' +
    '<div class="instr"><b>Then show your working</b>' + esc(d.press.evidence) + '</div>';
  const ta = document.createElement('textarea');
  ta.style.minHeight = '140px'; ta.placeholder = 'Type your piece here — or leave it blank if it is in your book.';
  ta.value = g.piece || '';
  const wc = document.createElement('div'); wc.className = 'wc';
  const upd = () => { const w = words(ta.value); wc.textContent = w ? w + ' words' : ''; };
  ta.addEventListener('input', () => { g.piece = ta.value; save(); upd(); refresh(); });
  c.appendChild(ta); c.appendChild(wc); upd();
  const ev = document.createElement('textarea');
  ev.style.minHeight = '70px'; ev.placeholder = 'Your working — or underline it in your book.';
  ev.value = g.evidence || '';
  ev.addEventListener('input', () => { g.evidence = ev.value; save(); refresh(); });
  c.appendChild(ev);

  const t1 = tick('I have written my piece', 'Piece written', !!g.wrote, on => { g.wrote = on; save(); refresh(); });
  const t2 = tick('I have shown my working', 'Working shown', !!g.proved, on => { g.proved = on; save(); refresh(); });
  const tr = document.createElement('div'); tr.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px;';
  tr.appendChild(t1); tr.appendChild(t2); c.appendChild(tr);
  const ob = document.createElement('p'); ob.className='orbook';
  ob.textContent = 'Tick these whether you typed above or wrote in your book.';
  c.appendChild(ob);

  const ch = document.createElement('h3'); ch.textContent = 'Check it yourself'; ch.style.marginTop='18px';
  c.appendChild(ch);
  const cg = document.createElement('div'); cg.className='checkgrid';
  d.press.checks.forEach((k,i) => {
    const l = document.createElement('label');
    const b = document.createElement('input'); b.type='checkbox'; b.checked = !!g.checks[i];
    b.addEventListener('change', () => { g.checks[i] = b.checked; save(); refresh(); });
    l.appendChild(b); l.appendChild(document.createTextNode(k)); cg.appendChild(l);
  });
  c.appendChild(cg);

  const bh = document.createElement('h3'); bh.textContent = 'How did it go?'; bh.style.marginTop='18px';
  const bl = document.createElement('p'); bl.className='lede';
  bl.textContent = 'Pick the one that honestly matches your writing, then copy its next step into your book. That step is the point.';
  c.appendChild(bh); c.appendChild(bl);
  const bw = document.createElement('div'); bw.className='bands';
  d.bands.forEach(b => {
    const el = document.createElement('div');
    el.className = 'bd' + (g.band === b.lvl ? ' picked' : '');
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.innerHTML = '<div class="lvl" style="color:' + d.color + '">' + esc(b.lvl) + '</div>' +
      '<div><div class="desc">' + esc(b.desc) + '</div><div class="next"><b>Next step:</b> ' + esc(b.next) + '</div></div>';
    const pick = () => { g.band = b.lvl; save(); renderDesk(); renderFloor(); };
    el.addEventListener('click', pick);
    el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } });
    bw.appendChild(el);
  });
  c.appendChild(bw);

  const row = document.createElement('div');
  row.style.cssText='margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;';
  const fin = document.createElement('button'); fin.className='primary';
  const todo = document.createElement('div'); todo.className='count-note';
  row.appendChild(fin); c.appendChild(row); c.appendChild(todo);

  if(g.filed){
    const ds = deskState(current), nx = DESKS.find(x => x.n === d.n + 1);
    const w = document.createElement('div'); w.className='filed';
    w.innerHTML = '<h3>Desk ' + d.n + ' sent to press</h3>' +
      '<p style="margin:8px 0;">Go ' + g.n + ' sent on ' + esc(g.filed) + '. <b>' + esc(d.outcome) + '</b></p>';
    const bar = document.createElement('div'); bar.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;';
    const p1 = document.createElement('button'); p1.className='primary'; p1.textContent='Print this desk';
    p1.addEventListener('click', () => openPrint(current));
    const p2 = document.createElement('button'); p2.className='ghost'; p2.textContent='Have another go';
    p2.addEventListener('click', () => { ds.goes.push(blankGo(ds.goes.length+1)); stageIx=0; buildStep=0; save(); renderDesk(); renderFloor(); });
    const p3 = document.createElement('button'); p3.className='ghost';
    p3.textContent = nx ? 'Desk ' + nx.n + ' — ' + nx.name + ' →' : 'Back to the floor';
    p3.addEventListener('click', () => { if(nx) openDesk(nx.id); else { show('floor'); renderFloor(); } });
    bar.appendChild(p1); bar.appendChild(p2); bar.appendChild(p3);
    w.appendChild(bar); c.appendChild(w);
  }

  const ds2 = deskState(current);
  if(ds2.goes.length > 1){
    const h = document.createElement('div'); h.className='history';
    h.innerHTML = '<h4>Earlier goes at this desk</h4><ul>' +
      ds2.goes.slice(0,-1).map(x => '<li>Go ' + x.n + ' · ' + esc(x.filed || 'not sent') + (x.band ? ' · ' + esc(x.band) : '') + '</li>').join('') +
      '</ul><p class="count-note" style="margin-top:6px;">They all print, so your PDF shows how your writing changed.</p>';
    c.appendChild(h);
  }

  function refresh(){
    const all = d.press.checks.every((_,i) => g.checks[i]);
    const miss = [];
    if(!g.wrote) miss.push('write your piece and tick it');
    if(!g.proved) miss.push('show your working and tick it');
    if(!all) miss.push('tick every box you can honestly tick');
    if(!g.band) miss.push('say how it went');
    fin.disabled = miss.length > 0;
    fin.textContent = g.filed ? 'Update this go' : 'Send to press';
    todo.textContent = miss.length ? 'The press needs: ' + miss.join(' · ') : '';
  }
  fin.addEventListener('click', () => {
    const first = !g.filed;
    g.filed = today(); g.stages.press = true;
    save(); renderDesk(); renderFloor();
    if(first) window.scrollTo({top:document.body.scrollHeight});
  });
  refresh();
  return c;
}

let printOpts = {scope:'all', deskId:null, essentials:false, allGoes:true};

function openPrint(deskId){
  const dlg = document.getElementById('dialog'), box = document.getElementById('dialogBox');
  if(deskId){ printOpts.scope='desk'; printOpts.deskId = deskId; }
  const withWork = DESKS.filter(d => anyWork(d.id));
  function draw(){
    box.innerHTML = '<h2>Print / Save as PDF</h2>' +
      '<p>Pick what goes in. In the print window, choose <b>Save as PDF</b> as the destination.</p><div id="opts"></div>' +
      '<label class="field-label" for="deskPick">Which desk</label>' +
      '<select id="deskPick"' + (printOpts.scope==='desk' ? '' : ' disabled') + '>' +
        DESKS.map(d => '<option value="' + d.id + '"' + (printOpts.deskId===d.id?' selected':'') + '>Desk ' + d.n + ' — ' + esc(d.name) + '</option>').join('') +
      '</select>' +
      '<label style="display:flex;gap:9px;align-items:center;margin-top:14px;font-size:0.87rem;">' +
      '<input type="checkbox" id="allGoes"' + (printOpts.allGoes?' checked':'') + '> Include every go, not just the latest</label>' +
      '<p class="count-note" id="pSum" style="margin-top:10px;"></p>' +
      '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">' +
      '<button class="primary" id="doPrint">Print</button><button class="ghost" id="cancelPrint">Cancel</button></div>';
    const opts = [
      {k:'all', t:'The whole edition', d:'Every desk you have worked at, with the jobs, your writing and how it went.'},
      {k:'essentials', t:'The essentials only', d:'Just the final piece, the working, the band and the next step for each desk. Much shorter.'},
      {k:'desk', t:'One desk', d:'Only the desk you pick below.'}
    ];
    const host = box.querySelector('#opts');
    opts.forEach(o => {
      const sel = o.k==='essentials' ? (printOpts.essentials && printOpts.scope!=='desk')
                : o.k==='all' ? (!printOpts.essentials && printOpts.scope==='all')
                : (printOpts.scope==='desk');
      const el = document.createElement('div');
      el.className = 'optrow' + (sel?' sel':'');
      el.innerHTML = '<div><div class="t">' + o.t + '</div><div class="d">' + o.d + '</div></div>';
      el.addEventListener('click', () => {
        if(o.k==='all'){ printOpts.scope='all'; printOpts.essentials=false; }
        else if(o.k==='essentials'){ printOpts.scope='all'; printOpts.essentials=true; }
        else { printOpts.scope='desk'; printOpts.essentials=false; if(!printOpts.deskId) printOpts.deskId = DESKS[0].id; }
        draw();
      });
      host.appendChild(el);
    });
    box.querySelector('#deskPick').addEventListener('change', e => { printOpts.deskId = e.target.value; draw(); });
    box.querySelector('#allGoes').addEventListener('change', e => { printOpts.allGoes = e.target.checked; draw(); });
    const n = printOpts.scope==='desk' ? 1 : withWork.length;
    box.querySelector('#pSum').textContent = withWork.length === 0
      ? 'You have not started any desks yet, so the PDF will just be your cover page.'
      : n + ' desk' + (n===1?'':'s') + ' will be printed.';
    box.querySelector('#cancelPrint').addEventListener('click', () => { dlg.hidden = true; });
    box.querySelector('#doPrint').addEventListener('click', () => {
      dlg.hidden = true; buildPrint(); setTimeout(() => window.print(), 60);
    });
  }
  draw(); dlg.hidden = false;
}

function pBlock(label, prompt, answer, ticked){
  let body;
  if((answer||'').trim()) body = '<div class="pans">' + esc(answer) + '</div>';
  else if(ticked) body = '<div class="pnone">Written in the exercise book.</div>';
  else body = '<div class="pnone">Not attempted.</div>';
  return '<div class="pitem"><p class="pq">' + esc(label) + '</p>' +
    (prompt ? '<p class="pp">' + esc(prompt) + '</p>' : '') + body + '</div>';
}

function buildPrint(){
  const root = document.getElementById('printRoot');
  const list = printOpts.scope==='desk'
    ? DESKS.filter(d => d.id === printOpts.deskId)
    : DESKS.filter(d => anyWork(d.id));

  let h = '<div class="pdoc"><div class="pcover"><h1>The Junior Editor</h1>' +
    '<div class="meta">' + esc(state.name || 'Editor') + ' &nbsp;·&nbsp; ' + yearLabel(state.year) +
    ' &nbsp;·&nbsp; printed ' + today() + ' &nbsp;·&nbsp; ' + desksFiled() + ' of 12 desks sent to press' +
    (printOpts.essentials ? ' &nbsp;·&nbsp; essentials only' : '') + '</div></div>';

  if(!list.length){ root.innerHTML = h + '<p class="pp">No desks started yet.</p></div>'; return; }

  list.forEach(d => {
    const ds = deskState(d.id);
    let goes = ds.goes.filter(g => g.filed || g.piece || g.evidence || g.band ||
      ['y2','y3','y4'].some(y => g.tasks[y].text || g.tasks[y].done));
    if(!goes.length) goes = [ds.goes[ds.goes.length-1]];
    if(!printOpts.allGoes) goes = goes.slice(-1);

    h += '<section class="pdesk"><h2>Desk ' + d.n + ' &middot; ' + esc(d.name) + '</h2>' +
      '<p class="pout">' + esc(d.outcome) + '</p>' +
      '<p class="pcurr">' + esc(d.au[state.year].split(' — ')[0]) + ' &nbsp;·&nbsp; NZC ' + yearLabel(state.year) + '</p>';

    goes.forEach(g => {
      h += '<div class="pgo"><div class="ph">Go ' + g.n + ' &middot; started ' + esc(g.started) +
        (g.filed ? ' &middot; sent ' + esc(g.filed) : ' &middot; not sent') + '</div>';
      if(!printOpts.essentials){
        ['y2','y3','y4'].forEach(y => {
          const s = g.tasks[y];
          if(s.text || s.done) h += pBlock(yearLabel(y) + ' job', d.tasks[y].prompt, s.text, s.done);
        });
      }
      h += pBlock('To press — final piece', d.press.prompt, g.piece, g.wrote);
      h += pBlock('Working', d.press.evidence, g.evidence, g.proved);
      if(!printOpts.essentials){
        const tk = d.press.checks.filter((_,i) => g.checks[i]);
        if(tk.length) h += '<ul class="pchecks">' + tk.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>';
      }
      if(g.band){
        const b = d.bands.find(x => x.lvl === g.band);
        h += '<div class="pband"><div class="pl">How it went</div><div class="pv">' + esc(g.band) + '</div>' +
          (b ? '<div class="pn"><b>Next step:</b> ' + esc(b.next) + '</div>' : '') + '</div>';
      }
      h += '</div>';
    });
    h += '<div class="psig">Teacher comment &nbsp;' + '.'.repeat(88) + '</div></section>';
  });
  root.innerHTML = h + '</div>';
}

/* ============================================================
   WHO + NAV
   ============================================================ */
function askWho(first){
  const dlg = document.getElementById('dialog'), box = document.getElementById('dialogBox');
  box.innerHTML = '<h2>' + (first ? 'Welcome to the newsroom' : 'Your details') + '</h2>' +
    '<p>This goes at the top of everything you print. Nothing is sent anywhere &mdash; it stays in this browser.</p>' +
    '<label class="field-label" for="nm">Your name</label>' +
    '<input type="text" id="nm" placeholder="e.g. Amira" value="' + esc(state.name) + '">' +
    '<label class="field-label" for="yr">Your year</label><select id="yr">' +
    YEARS.map(y => '<option value="' + y.k + '"' + (state.year===y.k?' selected':'') + '>' + y.label + '</option>').join('') +
    '</select><div style="margin-top:16px;"><button class="primary" id="whoGo">' + (first?'Start':'Save') + '</button></div>';
  dlg.hidden = false;
  const go = () => {
    const v = document.getElementById('nm').value.trim();
    if(!v) return;
    state.name = v; state.year = document.getElementById('yr').value;
    save(); dlg.hidden = true; renderFloor();
  };
  document.getElementById('whoGo').addEventListener('click', go);
  document.getElementById('nm').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
}
function show(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('nav.tabs button[data-screen]').forEach(b => b.classList.toggle('active', b.dataset.screen === name));
  window.scrollTo({top:0});
}
document.querySelectorAll('nav.tabs button[data-screen]').forEach(b =>
  b.addEventListener('click', () => { show(b.dataset.screen);
    if(b.dataset.screen==='floor') renderFloor();
    if(b.dataset.screen==='curriculum') renderCurriculum(); }));
document.getElementById('backBtn').addEventListener('click', () => { show('floor'); renderFloor(); });
document.getElementById('printBtn').addEventListener('click', () => openPrint(null));
document.getElementById('editWho').addEventListener('click', () => askWho(false));

(function init(){
  load();
  renderFloor();
  if(!state.name) askWho(true);
})();
</script>
